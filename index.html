<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电视全能播放器</title>
    <!-- 引入西瓜播放器样式与核心库 -->
    <link rel="stylesheet" href="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/xgplayer/2.31.2/index.min.css">
    <script src="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/xgplayer/2.31.2/index.js" charset="utf-8"></script>
    <!-- 引入 HLS 解码插件 -->
    <script src="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/xgplayer-hls/2.5.2/index.min.js" charset="utf-8"></script>

    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #player-container { width: 90vw; height: 75vh; background: #111; }
        .control-bar { margin-top: 15px; display: flex; gap: 10px; width: 90vw; }
        input { flex: 1; padding: 12px; font-size: 16px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; background: #e50914; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:focus, input:focus { outline: 3px solid #ffcc00; }
    </style>
</head>
<body>

    <div class="container">
        <div id="player-container"></div>
        <div class="control-bar">
            <input type="text" id="streamUrl" placeholder="请输入 https:// 开头的 M3U8 / MP4 链接..." value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">
            <button onclick="playSource()">播放</button>
        </div>
    </div>

    <script>
        let player = null;

        function playSource() {
            let url = document.getElementById('streamUrl').value.trim();
            if (!url) {
                alert('请输入有效的视频链接！');
                return;
            }

            // 如果已有播放器，先销毁旧的实例
            if (player) {
                player.destroy();
                player = null;
            }

            // 统一使用 Player 构造函数，西瓜播放器会自动根据链接后缀加载 HLS 插件
            player = new Player({
                id: 'player-container',
                url: url,
                fluid: true,
                autoplay: true,
                cors: true,
                videoInit: true,
                playsinline: true
            });
        }

        // 页面加载后自动尝试播放上面的测试链接，用于验证电视浏览器是否正常
        window.onload = function() {
            playSource();
        };
    </script>
</body>
</html>
